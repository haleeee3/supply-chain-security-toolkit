name: Supply Chain Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'  # 매주 월요일 오전 9시 자동 실행

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Syft 설치 (SBOM 생성)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype 설치 (CVE 스캔)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: SBOM 생성
        run: |
          syft . -o json > sbom.json
          syft . -o table
          echo "✅ SBOM 생성 완료"

      - name: CVE 스캔
        run: |
          grype sbom:sbom.json --by-cve -o json > cve-results.json
          grype sbom:sbom.json --by-cve -o table
          echo "✅ CVE 스캔 완료"

      - name: EPSS 점수 조회 및 우선순위 분류
        run: |
          python3 << 'EOF'
          import json
          import urllib.request

          with open('cve-results.json') as f:
              data = json.load(f)

          matches = data.get('matches', [])
          
          # CVE ID 목록 추출
          cve_ids = list(set([
              m['vulnerability']['id'] 
              for m in matches 
              if m['vulnerability']['id'].startswith('CVE-')
          ]))

          if not cve_ids:
              print("CVE 없음")
              exit(0)

          # EPSS API 호출 (최대 100개씩)
          chunk = cve_ids[:100]
          query = ','.join(chunk)
          url = f"https://api.first.org/data/v1/epss?cve={query}"
          
          with urllib.request.urlopen(url) as res:
              epss_data = json.load(res)

          # 결과 정리
          epss_map = {
              item['cve']: float(item['epss']) 
              for item in epss_data.get('data', [])
          }

          # 우선순위 분류
          critical_epss = []
          for m in matches:
              cve_id = m['vulnerability']['id']
              severity = m['vulnerability'].get('severity', 'Unknown')
              epss = epss_map.get(cve_id, 0)
              
              if severity in ['Critical', 'High'] and epss > 0.1:
                  critical_epss.append({
                      'cve': cve_id,
                      'severity': severity,
                      'epss': f"{epss*100:.2f}%"
                  })

          print(f"\n🚨 즉시 조치 필요 (Critical/High + EPSS > 10%):")
          if critical_epss:
              for item in critical_epss:
                  print(f"  {item['cve']} | {item['severity']} | EPSS: {item['epss']}")
          else:
              print("  없음")

          # 결과 저장
          with open('epss-results.json', 'w') as f:
              json.dump(critical_epss, f, indent=2)
          EOF

      - name: EPSS 결과 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: epss-results
          path: epss-results.json

      - name: Critical/High CVE 확인
        run: |
          CRITICAL=$(cat cve-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          matches = data.get('matches', [])
          critical = [m for m in matches if m.get('vulnerability', {}).get('severity') in ['Critical', 'High']]
          print(len(critical))
          ")
          echo "🚨 Critical/High CVE 수: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "⚠️ 심각한 취약점 발견!"
          fi

      - name: SBOM/CVE 결과 아티팩트 저장
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            sbom.json
            cve-results.json

      - name: GitHub Issues 자동 생성
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import urllib.parse
          import os

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']

          # EPSS 결과 로드
          try:
              with open('epss-results.json') as f:
                  urgent_cves = json.load(f)
          except:
              print("EPSS 결과 없음")
              exit(0)

          if not urgent_cves:
              print("즉시 조치 필요한 CVE 없음 ✅")
              exit(0)

          for cve in urgent_cves:
              title = f"[CVE] {cve['cve']} - {cve['severity']} (EPSS: {cve['epss']})"
              body = f"""## 🚨 즉시 조치 필요

          **CVE ID:** {cve['cve']}
          **심각도:** {cve['severity']}
          **EPSS:** {cve['epss']}
          **VEX 상태:** affected

          ## 조치 방법
          영향받는 패키지를 최신 버전으로 업그레이드하세요.

          ## 참고
          - [NVD 상세](https://nvd.nist.gov/vuln/detail/{cve['cve']})
          - [EPSS 점수](https://api.first.org/data/v1/epss?cve={cve['cve']})
          """

              data = json.dumps({
                  'title': title,
                  'body': body,
                  'labels': ['security', 'vulnerability']
              }).encode()

              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues',
                  data=data,
                  headers={
                      'Authorization': f'token {token}',
                      'Content-Type': 'application/json',
                      'Accept': 'application/vnd.github.v3+json'
                  }
              )

              try:
                  with urllib.request.urlopen(req) as res:
                      result = json.load(res)
                      print(f"✅ Issue 생성됨: {result['html_url']}")
              except Exception as e:
                  print(f"⚠️ Issue 생성 실패: {e}")
          EOF
